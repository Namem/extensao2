; Ceres Diagnóstico — Sprint 2
; ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB PSRAM)
; TFLite Micro com imagens de teste embutidas

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Serial
monitor_speed = 115200
upload_port   = COM5
monitor_port  = COM5

; Flash 16MB
board_build.flash_size = 16MB

; PSRAM OPI — necessário para tensor arena de 512KB
board_build.arduino.memory_type = qio_opi

; Partições para acomodar modelo de 639KB + código
board_build.partitions = huge_app.csv

; TFLite Micro para Arduino/ESP32
lib_deps =
  knolleary/PubSubClient@^2.8
  spaziochirale/Chirale_TensorFLowLite@^2.0.0

; Flags necessárias para TFLite Micro
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -O2
