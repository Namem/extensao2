version: '3.8'

services:
  django:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      # Modelo TFLite (nao commitado — montado do host)
      - ./backend/datasets/modelo:/app/datasets/modelo:ro
      # Banco SQLite persistido entre restarts
      - sqlite_data:/app
    environment:
      - DJANGO_SETTINGS_MODULE=ceres_core.settings_notebook
    restart: unless-stopped

volumes:
  sqlite_data:
