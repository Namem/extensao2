services:
  django:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      # Código montado do host — edições refletem sem rebuild (SQLite persiste aqui)
      - ./backend:/app
      # Modelo TFLite (nao commitado)
      - ./backend/datasets/modelo:/app/datasets/modelo:ro
    environment:
      - DJANGO_SETTINGS_MODULE=ceres_core.settings_notebook
    # Migra + sobe o servidor com auto-reload
    command: >
      sh -c "python manage.py migrate --settings=ceres_core.settings_notebook &&
             python manage.py mqtt_listener --settings=ceres_core.settings_notebook &
             python manage.py runserver 0.0.0.0:8080 --settings=ceres_core.settings_notebook"
    restart: unless-stopped

